<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movimiento - Control de Finanzas</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
</head>
<body class="bg-[#F7F8FA] text-[#121212] min-h-screen flex items-center justify-center px-4 py-8">

    <div class="w-full max-w-md bg-white p-8 rounded-[32px] shadow-sm border border-gray-100 space-y-6">
        
        <!-- ENCABEZADO -->
        <div class="text-center relative">
            <a href="/" class="absolute left-0 top-1/2 -translate-y-1/2 text-gray-400 hover:text-black p-1 rounded-full hover:bg-gray-100 transition">
                <span class="material-icons-round">arrow_back</span>
            </a>
            <h1 class="text-xl font-black text-gray-900" th:text="${movimiento.id} != null ? '✏️ Editar movimiento' : '💵 Nuevo movimiento'">
                Nuevo movimiento
            </h1>
            <p class="text-xs text-gray-400 mt-1">Registra de manera ágil tus ingresos o consumos</p>
        </div>

        <hr class="border-gray-100">

        <!-- FORMULARIO -->
        <form th:action="@{/guardar}" th:object="${movimiento}" method="post" class="space-y-5">
            <input type="hidden" th:field="*{id}" />

            <!-- Tipo de Movimiento (SELECTOR) -->
            <div>
                <label class="block text-[11px] font-extrabold uppercase tracking-wider text-gray-400 mb-2">¿Qué tipo de transacción es?</label>
                <div class="relative">
                    <select th:field="*{tipo}" required class="w-full bg-[#F3F4F6] border border-transparent focus:border-black focus:bg-white text-sm rounded-2xl px-4 py-3.5 appearance-none focus:outline-none transition font-semibold">
                        <option value="INGRESO">🟢 Ingreso (Entrada de dinero)</option>
                        <option value="GASTO">🔴 Gasto (Consumo o Pago)</option>
                    </select>
                    <span class="material-icons-round absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none text-base">expand_more</span>
                </div>
            </div>

            <!-- Concepto (TEXTO) -->
            <div>
                <label class="block text-[11px] font-extrabold uppercase tracking-wider text-gray-400 mb-2">Concepto / Descripción</label>
                <div class="relative">
                    <span class="material-icons-round absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-lg">edit</span>
                    <input type="text" th:field="*{concepto}" placeholder="Ej. Pago de quincena, Compra súper..." required 
                           class="w-full bg-[#F3F4F6] border border-transparent focus:border-black focus:bg-white text-sm rounded-2xl pl-11 pr-4 py-3.5 focus:outline-none transition font-medium">
                </div>
            </div>

            <!-- Monto ($) -->
            <div>
                <label class="block text-[11px] font-extrabold uppercase tracking-wider text-gray-400 mb-2">Monto ($)</label>
                <div class="relative">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 font-extrabold text-gray-500">$</span>
                    <input type="number" step="0.01" min="0.01" th:field="*{monto}" placeholder="0.00" required 
                           class="w-full bg-[#F3F4F6] border border-transparent focus:border-black focus:bg-white text-lg rounded-2xl pl-8 pr-4 py-3.5 focus:outline-none transition font-extrabold">
                </div>
            </div>

            <!-- Fecha (DATE) -->
            <div>
                <label class="block text-[11px] font-extrabold uppercase tracking-wider text-gray-400 mb-2">Fecha del movimiento</label>
                <div class="relative flex items-center">
                    <span class="material-icons-round absolute left-4 text-gray-400 text-lg pointer-events-none">calendar_today</span>
                    <input type="date" th:field="*{fecha}" required 
                           class="w-full bg-[#F3F4F6] border border-transparent focus:border-black focus:bg-white text-sm rounded-2xl pl-11 pr-4 py-3.5 focus:outline-none transition font-semibold">
                </div>
            </div>

            <!-- BOTÓN GUARDAR -->
            <button type="submit" class="w-full bg-black text-white hover:bg-gray-900 active:scale-[0.98] transition py-4 rounded-2xl font-bold shadow-lg shadow-black/10 flex items-center justify-center space-x-2">
                <span class="material-icons-round text-lg">check_circle</span>
                <span>Guardar transacción</span>
            </button>
        </form>

        <div class="text-center">
            <a href="/" class="text-xs font-semibold text-gray-400 hover:text-black transition">
                Cancelar y regresar
            </a>
        </div>

    </div>

</body>
</html>
